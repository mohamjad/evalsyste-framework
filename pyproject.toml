[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalsyste-framework"
version = "2.0.0"
description = "Lightweight toolkit for monitoring contradiction, clarity, and stability signals across growing context."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "mohamjad", email = "mohammedamjad526@gmail.com" }
]
dependencies = [
  "numpy>=1.21.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0"
]
semantic = [
  "sentence-transformers>=2.2.0"
]
neural = [
  "torch>=2.0.0"
]
optimization = [
  "scikit-learn>=1.0.0"
]

[project.scripts]
evalsyste = "evalsyste.cli:main"

[project.urls]
Homepage = "https://github.com/mohamjad/evalsyste-framework"
Repository = "https://github.com/mohamjad/evalsyste-framework"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = [
  "ai_system_stability_framework",
  "hyperparameter_optimization",
  "semantic_analyzer",
  "statistical_analysis"
]
packages = ["evalsyste"]
