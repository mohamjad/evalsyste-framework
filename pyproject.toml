[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalsyste-framework"
version = "2.0.0"
description = "Lightweight toolkit for monitoring contradiction, clarity, and stability signals across growing context."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "mohamjad", email = "mohammedamjad526@gmail.com" }
]
dependencies = [
  "numpy>=1.21.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0"
]
semantic = [
  "sentence-transformers>=2.2.0"
]
neural = [
  "torch>=2.0.0"
]
optimization = [
  "scikit-learn>=1.0.0"
]

